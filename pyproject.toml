[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-from-link"
version = "0.1.0"
description = "Collect scholarly papers linked in an exported WhatsApp chat."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Paper from Link contributors" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "trafilatura>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
paper-collector = "whatsapp_paper_collector.cli:main"

[tool.setuptools.packages.find]
include = ["whatsapp_paper_collector*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
